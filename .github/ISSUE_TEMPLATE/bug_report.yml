name: Bug report
description: Report a reproducible Voxel Vault product bug without posting sensitive information.
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Do not post passwords, private keys, payment-card/bank information, identity documents, private deeds/leases, account tokens, or other sensitive information.** Use synthetic/sample screenshots when possible.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Home / Demo
        - Property creator
        - 3D preview / voxel viewer
        - World / map
        - Vault
        - Payment / checkout
        - Optional mint / wallet
        - More / advanced tool
        - Privacy / Terms / About
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
      placeholder: Describe the expected result.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      placeholder: Include the exact non-sensitive error message if there was one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Tap...
        3. See...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / browser
      placeholder: e.g. iPhone Safari, Chrome desktop
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or extra context
      description: Remove or cover account, payment, address, identity, wallet, or other private information before attaching.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed private or sensitive information from this report.
          required: true
