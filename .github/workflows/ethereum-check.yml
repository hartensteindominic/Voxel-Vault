name: Ethereum Contract Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run chain:compile
      - run: node scripts/check-profit-engine-bytecode.mjs
      - run: npx hardhat test
