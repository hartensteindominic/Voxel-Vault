name: Full Repository File Audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: voxel-vault-file-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit-all-tracked-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Read and audit every tracked file
        run: node scripts/audit-all-files.mjs
      - name: Verify package-lock matches package.json
        run: node scripts/test-lockfile-sync.mjs
