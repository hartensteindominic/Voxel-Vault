name: Galactic Trust quality gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  galactic-trust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build

  prepare-finance-replacement:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Voxel Vault
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create finance replacement branch
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/hartensteindominic/Galactic.git /tmp/galactic
          branch="finance-replacement-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/' /tmp/galactic/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace Voxel Vault with Galactic business finance app"
          git push origin "$branch"
