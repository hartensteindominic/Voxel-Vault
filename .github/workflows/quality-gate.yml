name: Voxel Vault Quality Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [fix/nft-media-centering, main]

concurrency:
  group: voxel-vault-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:rewards
      - run: npm run test:universal
      - run: npm run test:media
      - run: npm run test:mobile
      - run: npm run test:collection
      - run: npm run test:commerce
      - run: npm run test:routes
      - run: npm run test:voxelflip-launch
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SITE_URL: https://voxel-vault.vercel.app

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # Critical vulnerabilities remain a hard release blocker. High-severity
      # findings are recorded in docs/SECURITY_REVIEW.md and require a separate
      # dependency-upgrade release because the current fixes are breaking.
      - run: npm audit --omit=dev --audit-level=critical
