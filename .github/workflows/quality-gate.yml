name: Galactic Trust quality gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  galactic-trust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Galactic Trust regression suite
        run: npm run test:galactic
      - name: Production build
        run: npm run build
