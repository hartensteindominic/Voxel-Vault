name: OpenSea Listing Action Shape

on:
  push:
    branches:
      - feat/voxelflip-opensea-wallet-listing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe preview listing actions without signing
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 30 \
            'https://voxel-vault-git-feat-v-c9a3b9-hartensteindominic-2416s-projects.vercel.app/api/debug/opensea-actions-shape' \
            | tee response.json
          jq '{status,steps,error}' response.json
          test "$(jq -r '.status' response.json)" -ge 200
          test "$(jq -r '.status' response.json)" -lt 500
