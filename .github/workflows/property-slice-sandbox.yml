name: Property Slice Sandbox

on:
  pull_request:
    paths:
      - 'lib/real-estate/property-slice-sandbox.js'
      - 'app/api/geo/property-slice/**'
      - 'app/geo/slice/**'
      - 'scripts/test-property-slice-sandbox.mjs'
      - '.github/workflows/property-slice-sandbox.yml'
  push:
    branches:
      - main
    paths:
      - 'lib/real-estate/property-slice-sandbox.js'
      - 'app/api/geo/property-slice/**'
      - 'app/geo/slice/**'
      - 'scripts/test-property-slice-sandbox.mjs'

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Property Slice safety model
        run: node scripts/test-property-slice-sandbox.mjs
