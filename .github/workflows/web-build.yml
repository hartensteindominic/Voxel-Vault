name: Voxel Vault web build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:commerce
      - run: npm run test:vault-store
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://voxel-vault.vercel.app
