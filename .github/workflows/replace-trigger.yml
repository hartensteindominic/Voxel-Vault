name: Trigger Galactic Replacement
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-trigger.yml'
permissions:
  contents: write
  pull-requests: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Voxel Vault
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build replacement branch from Galactic
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/hartensteindominic/Galactic.git /tmp/galactic
          branch="galactic-live-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/galactic/. .
          rm -rf .git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace Voxel Vault with Galactic business finance app"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Replace Voxel Vault with Galactic business finance app" --body "Automated full replacement for today's launch."
