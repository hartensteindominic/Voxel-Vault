name: App Store Release (No Mac Required)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galactic-trust-business-app-store
  cancel-in-progress: false

env:
  IOS_DIR: ios/GalacticTrustBusiness
  BUNDLE_ID: com.hartensteindominic.galactictrustbusiness

jobs:
  release:
    name: Build, cloud sign, and upload Galactic Trust Business
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::App Store releases are allowed only from main. Merge and validate the release candidate before uploading."
            exit 1
          fi

      - name: Determine deterministic build number
        shell: bash
        run: |
          set -euo pipefail
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          if [[ ! "$BUILD_NUMBER" =~ ^[0-9]+$ || "$BUILD_NUMBER" -lt 1 || "$BUILD_NUMBER" -gt 9999 ]]; then
            echo "::error::Git commit-count build number must be between 1 and 9999; got ${BUILD_NUMBER}."
            exit 1
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Using CFBundleVersion $BUILD_NUMBER for commit $GITHUB_SHA"

      - name: Select current stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Xcode 26 or newer
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          major="$(xcodebuild -version | awk '/^Xcode / { split($2, v, "."); print v[1] }')"
          if [[ -z "$major" || "$major" -lt 26 ]]; then
            echo "::error::Current App Store submissions require Xcode 26 or newer."
            exit 1
          fi

      - name: Verify App Store Connect credentials
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          required=(APPLE_TEAM_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY)
          missing=0
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Verify public App Store URLs
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            "https://voxelvault.io/business/privacy" \
            "https://voxelvault.io/business/support"; do
            echo "Checking $url"
            body="$(curl --fail --location --silent --show-error --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 "$url")"
            grep -qi "Galactic Trust Business" <<< "$body" || {
              echo "::error::$url did not return the expected Galactic Trust Business page"
              exit 1
            }
          done

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate app icon and Xcode project
        working-directory: ${{ env.IOS_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_app_icon.py
          xcodegen generate

      - name: Verify release identity
        working-directory: ${{ env.IOS_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          settings="$(xcodebuild -project GalacticTrustBusiness.xcodeproj -target GalacticTrustBusiness -configuration Release -showBuildSettings)"
          version="$(awk -F ' = ' '/MARKETING_VERSION = / { print $2; exit }' <<< "$settings")"
          bundle_id="$(awk -F ' = ' '/PRODUCT_BUNDLE_IDENTIFIER = / { print $2; exit }' <<< "$settings")"
          [[ "$version" == "1.0" ]] || { echo "::error::Expected marketing version 1.0, got $version"; exit 1; }
          [[ "$bundle_id" == "$BUNDLE_ID" ]] || { echo "::error::Unexpected bundle ID: $bundle_id"; exit 1; }

      - name: Build for iOS Simulator
        working-directory: ${{ env.IOS_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project GalacticTrustBusiness.xcodeproj \
            -scheme GalacticTrustBusiness \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests
        working-directory: ${{ env.IOS_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(v["udid"] for runtime in d.values() for v in runtime if v["name"].startswith("iPhone") and v["isAvailable"]))')"
          xcodebuild \
            -project GalacticTrustBusiness.xcodeproj \
            -scheme GalacticTrustBusiness \
            -destination "platform=iOS Simulator,id=${DEVICE_ID}" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Write App Store Connect API key
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          grep -q -- '-----BEGIN PRIVATE KEY-----' "$KEY_PATH" || {
            echo "::error::APP_STORE_CONNECT_PRIVATE_KEY is not a valid .p8 private-key payload."
            exit 1
          }
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Create unsigned release archive
        working-directory: ${{ env.IOS_DIR }}
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project GalacticTrustBusiness.xcodeproj \
            -scheme GalacticTrustBusiness \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GalacticTrustBusiness.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean archive

      - name: Cloud sign and upload to App Store Connect
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          EXPORT_PATH="$RUNNER_TEMP/app-store-export"
          cat > "$EXPORT_OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/GalacticTrustBusiness.xcarchive" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Remove temporary API key
        if: always()
        shell: bash
        run: rm -f "${ASC_KEY_PATH:-}"

      - name: Upload summary
        if: success()
        shell: bash
        run: |
          {
            echo '### Galactic Trust Business uploaded'
            echo ''
            echo "Build ${BUILD_NUMBER} was cloud-signed and uploaded to App Store Connect. Apple still needs to process it before it can be selected for submission."
          } >> "$GITHUB_STEP_SUMMARY"
