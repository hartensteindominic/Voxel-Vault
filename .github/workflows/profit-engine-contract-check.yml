name: Profit Engine Contract Check

on:
  push:
    branches:
      - feature/solo-base-profit-engine-v1

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run chain:compile
