name: Lower recorded cash total

on:
  push:
    branches: [fix/lower-recorded-cash-total]

permissions:
  contents: write

jobs:
  patch-dashboard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lower-recorded-cash-total
          fetch-depth: 0

      - name: Move recorded cash total slightly lower
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; p=Path('ios/GalacticTrustBusiness/GalacticTrustBusiness/DashboardView.swift'); s=p.read_text(); old='                    .contentTransition(.numericText())\n\n                HStack(spacing: 7) {'; new='                    .contentTransition(.numericText())\n                    .padding(.top, width > 620 ? 8 : 4)\n\n                HStack(spacing: 7) {'; assert s.count(old) == 1, f'expected one target, found {s.count(old)}'; p.write_text(s.replace(old,new,1))"

      - name: Commit focused layout adjustment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/GalacticTrustBusiness/GalacticTrustBusiness/DashboardView.swift
          git commit -m "Lower recorded cash total slightly"
          git push origin HEAD:fix/lower-recorded-cash-total
