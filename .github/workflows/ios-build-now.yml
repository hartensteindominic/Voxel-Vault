name: iOS Build Now (No Signing)

on:
  pull_request:
    paths:
      - 'ios/GalacticTrustBusiness/**'
      - '.github/workflows/ios-build-now.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test Galactic Trust Business
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select current stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Xcode 26 or newer
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          major="$(xcodebuild -version | awk '/^Xcode / { split($2, v, "."); print v[1] }')"
          if [[ -z "$major" || "$major" -lt 26 ]]; then
            echo "::error::App Store verification requires Xcode 26 or newer."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios/GalacticTrustBusiness
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_app_icon.py
          xcodegen generate

      - name: Build for iOS Simulator
        working-directory: ios/GalacticTrustBusiness
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project GalacticTrustBusiness.xcodeproj \
            -scheme GalacticTrustBusiness \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Select App Store screenshot devices
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"

          IPHONE_ID="$(python3 - "$RUNNER_TEMP/devices.json" <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path))['devices']
          devices = [d for runtime in data.values() for d in runtime if d.get('isAvailable')]
          preferred = [
              'iPhone 17 Pro Max', 'iPhone Air', 'iPhone 16 Pro Max',
              'iPhone 16 Plus', 'iPhone 15 Pro Max', 'iPhone 15 Plus',
              'iPhone 14 Pro Max'
          ]
          for name in preferred:
              for device in devices:
                  if device.get('name') == name:
                      print(device['udid'])
                      raise SystemExit
          raise SystemExit('No App Store 6.9-inch iPhone simulator is available')
          PY
          )"

          IPAD_ID="$(python3 - "$RUNNER_TEMP/devices.json" <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path))['devices']
          devices = [d for runtime in data.values() for d in runtime if d.get('isAvailable')]
          preferred = [
              'iPad Pro 13-inch (M5)', 'iPad Pro 13-inch (M4)',
              'iPad Air 13-inch (M4)', 'iPad Air 13-inch (M3)',
              'iPad Air 13-inch (M2)'
          ]
          for name in preferred:
              for device in devices:
                  if device.get('name') == name:
                      print(device['udid'])
                      raise SystemExit
          raise SystemExit('No App Store 13-inch iPad simulator is available')
          PY
          )"

          echo "IPHONE_ID=$IPHONE_ID" >> "$GITHUB_ENV"
          echo "IPAD_ID=$IPAD_ID" >> "$GITHUB_ENV"

      - name: Run unit tests
        working-directory: ios/GalacticTrustBusiness
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project GalacticTrustBusiness.xcodeproj \
            -scheme GalacticTrustBusiness \
            -destination "platform=iOS Simulator,id=${IPHONE_ID}" \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Capture real App Store iPhone screenshots
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ID="com.hartensteindominic.galactictrustbusiness"
          APP_PATH="$(find "$RUNNER_TEMP/DerivedData/Build/Products" -type d -name 'GalacticTrustBusiness.app' -print -quit)"
          test -n "$APP_PATH"

          xcrun simctl boot "$IPHONE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$IPHONE_ID" -b
          xcrun simctl install "$IPHONE_ID" "$APP_PATH"

          capture() {
            tab="$1"
            filename="$2"
            temp_png="$RUNNER_TEMP/${filename%.jpg}.png"
            xcrun simctl terminate "$IPHONE_ID" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$IPHONE_ID" "$BUNDLE_ID" -AppStoreScreenshots -ScreenshotTab "$tab"
            sleep 4
            xcrun simctl io "$IPHONE_ID" screenshot "$temp_png"
            sips -s format jpeg -s formatOptions best "$temp_png" --out "$RUNNER_TEMP/$filename" >/dev/null
            rm -f "$temp_png"
          }

          capture dashboard "iPhone-01-Dashboard.jpg"
          capture transactions "iPhone-02-Transactions.jpg"
          capture cashflow "iPhone-03-Cash-Flow.jpg"
          capture ai "iPhone-04-AI-Manager.jpg"

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/GalacticTrustBusiness-Simulator.zip"

      - name: Capture real App Store iPad screenshot
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ID="com.hartensteindominic.galactictrustbusiness"
          APP_PATH="$(find "$RUNNER_TEMP/DerivedData/Build/Products" -type d -name 'GalacticTrustBusiness.app' -print -quit)"
          test -n "$APP_PATH"

          xcrun simctl boot "$IPAD_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$IPAD_ID" -b
          xcrun simctl install "$IPAD_ID" "$APP_PATH"
          xcrun simctl launch "$IPAD_ID" "$BUNDLE_ID" -AppStoreScreenshots -ScreenshotTab dashboard
          sleep 4
          temp_png="$RUNNER_TEMP/iPad-01-Dashboard.png"
          xcrun simctl io "$IPAD_ID" screenshot "$temp_png"
          sips -s format jpeg -s formatOptions best "$temp_png" --out "$RUNNER_TEMP/iPad-01-Dashboard.jpg" >/dev/null
          rm -f "$temp_png"

      - name: Verify App Store screenshot files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess

          temp = os.environ['RUNNER_TEMP']
          iphone_files = [
              'iPhone-01-Dashboard.jpg',
              'iPhone-02-Transactions.jpg',
              'iPhone-03-Cash-Flow.jpg',
              'iPhone-04-AI-Manager.jpg',
          ]
          ipad_files = ['iPad-01-Dashboard.jpg']
          accepted_iphone = {(1260, 2736), (1290, 2796), (1320, 2868)}
          accepted_ipad = {(2064, 2752), (2048, 2732)}

          def dimensions(path):
              width = int(subprocess.check_output(['sips', '-g', 'pixelWidth', path], text=True).split(':')[-1].strip())
              height = int(subprocess.check_output(['sips', '-g', 'pixelHeight', path], text=True).split(':')[-1].strip())
              return width, height

          for name in iphone_files:
              path = os.path.join(temp, name)
              if not os.path.isfile(path) or os.path.getsize(path) == 0:
                  raise SystemExit(f'Missing screenshot: {name}')
              size = dimensions(path)
              if size not in accepted_iphone:
                  raise SystemExit(f'{name} has unsupported App Store iPhone dimensions: {size}')
              print(name, size, 'JPEG/no alpha')

          for name in ipad_files:
              path = os.path.join(temp, name)
              if not os.path.isfile(path) or os.path.getsize(path) == 0:
                  raise SystemExit(f'Missing screenshot: {name}')
              size = dimensions(path)
              if size not in accepted_ipad:
                  raise SystemExit(f'{name} has unsupported App Store iPad dimensions: {size}')
              print(name, size, 'JPEG/no alpha')
          PY

      - name: Upload build and screenshots
        uses: actions/upload-artifact@v4
        with:
          name: GalacticTrustBusiness-native-preview
          path: |
            ${{ runner.temp }}/GalacticTrustBusiness-Simulator.zip
            ${{ runner.temp }}/iPhone-01-Dashboard.jpg
            ${{ runner.temp }}/iPhone-02-Transactions.jpg
            ${{ runner.temp }}/iPhone-03-Cash-Flow.jpg
            ${{ runner.temp }}/iPhone-04-AI-Manager.jpg
            ${{ runner.temp }}/iPad-01-Dashboard.jpg
          if-no-files-found: error
          retention-days: 7
