name: Voxel Vault Contracts

on:
  push:
    paths:
      - 'contracts/**'
      - 'test/**'
      - 'hardhat.config.js'
      - 'scripts/**'
      - 'lib/forge-launchpad-bootstrap-artifact.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/contracts.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'test/**'
      - 'hardhat.config.js'
      - 'scripts/**'
      - 'lib/forge-launchpad-bootstrap-artifact.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/contracts.yml'

permissions:
  contents: write

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run chain:compile
      - run: node scripts/export-forge-launchpad-browser-artifact.js
      - run: npm run test:forge
      - run: npm run test:solo-vault
      - run: npm run test:forge-launchpad
      - run: npm run test:forge-launchpad-bootstrap
      - name: Export reviewed launchpad build inputs
        uses: actions/upload-artifact@v4
        with:
          name: forge-launchpad-build-inputs
          retention-days: 1
          path: |
            package-lock.json
            lib/forge-launchpad-bootstrap-artifact.js
            artifacts/contracts/launchpad/ForgeLaunchpadBootstrap.sol/ForgeLaunchpadBootstrap.json
      - name: Commit regenerated lockfile and browser artifact
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json lib/forge-launchpad-bootstrap-artifact.js; then
            echo 'Generated files already match.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json lib/forge-launchpad-bootstrap-artifact.js
          git commit -m 'Refresh Forge launchpad generated inputs'
          git push origin HEAD:${GITHUB_REF_NAME}
