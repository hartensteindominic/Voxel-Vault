name: Voxel Vault Contracts

on:
  push:
    paths:
      - 'contracts/**'
      - 'test/**'
      - 'hardhat.config.js'
      - 'scripts/**'
      - 'public/forge/bytecode-*.txt'
      - 'package.json'
      - '.github/workflows/contracts.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'test/**'
      - 'hardhat.config.js'
      - 'scripts/**'
      - 'public/forge/bytecode-*.txt'
      - 'package.json'
      - '.github/workflows/contracts.yml'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run chain:compile
      - run: npm run chain:check:forge-bytecode
      - run: npm run chain:test:forge
      - name: Upload production Forge artifact
        uses: actions/upload-artifact@v4
        with:
          name: voxel-forge-revenue-artifact
          path: artifacts/contracts/VoxelForgeRevenue.sol/VoxelForgeRevenue.json
          if-no-files-found: error
