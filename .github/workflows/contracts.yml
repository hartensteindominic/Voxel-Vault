name: Voxel Vault Contracts

on:
  push:
    paths:
      - 'contracts/**'
      - 'hardhat.config.js'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/contracts.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'hardhat.config.js'
      - 'scripts/**'
      - 'package.json'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run chain:compile
