name: Voxel Vault Contracts

on:
  push:
    paths:
      - 'contracts/**'
      - 'test/**'
      - 'hardhat.config.js'
      - 'scripts/**'
      - 'public/forge/bytecode-*.txt'
      - 'public/profit-engine/**'
      - 'public/test-land/**'
      - 'package.json'
      - '.github/workflows/contracts.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'test/**'
      - 'hardhat.config.js'
      - 'scripts/**'
      - 'public/forge/bytecode-*.txt'
      - 'public/profit-engine/**'
      - 'public/test-land/**'
      - 'package.json'
      - '.github/workflows/contracts.yml'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run chain:compile
      - run: npm run chain:check:forge-bytecode
      - run: npm run chain:check:multipair-bytecode
      - run: npm run chain:test:forge
      - run: npm run chain:test:liquidity
      - run: npm run chain:test:property
      - run: npm run chain:test:test-land
      - name: Upload production Forge artifact
        uses: actions/upload-artifact@v4
        with:
          name: voxel-forge-revenue-artifact
          path: artifacts/contracts/VoxelForgeRevenue.sol/VoxelForgeRevenue.json
          if-no-files-found: error
      - name: Upload V6 multi-pair executor artifact
        uses: actions/upload-artifact@v4
        with:
          name: base-multi-arb-executor-artifact
          path: artifacts/contracts/BaseMultiArbExecutor.sol/BaseMultiArbExecutor.json
          if-no-files-found: error
      - name: Upload canonical property registry artifact
        uses: actions/upload-artifact@v4
        with:
          name: canonical-property-registry-artifact
          path: artifacts/contracts/CanonicalPropertyRegistry.sol/CanonicalPropertyRegistry.json
          if-no-files-found: error
      - name: Upload Base Sepolia test land artifact
        uses: actions/upload-artifact@v4
        with:
          name: voxel-test-land-artifact
          path: artifacts/contracts/VoxelTestLand.sol/VoxelTestLand.json
          if-no-files-found: error
