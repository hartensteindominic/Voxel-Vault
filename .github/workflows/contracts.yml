name: Voxel Vault Contracts

on:
  push:
    paths:
      - 'contracts/**'
      - 'test/**'
      - 'hardhat.config.js'
      - 'scripts/**'
      - 'lib/forge-launchpad-bootstrap-artifact.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/contracts.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'test/**'
      - 'hardhat.config.js'
      - 'scripts/**'
      - 'lib/forge-launchpad-bootstrap-artifact.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/contracts.yml'

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run chain:compile
      - run: node scripts/export-forge-launchpad-browser-artifact.js
      - name: Verify committed browser artifact
        run: git diff --exit-code -- lib/forge-launchpad-bootstrap-artifact.js
      - run: npm run test:forge
      - run: npm run test:solo-vault
      - run: npm run test:forge-launchpad
      - run: npm run test:forge-launchpad-bootstrap
