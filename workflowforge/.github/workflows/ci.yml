name: WorkflowForge CI

on:
  push:
    paths: ['workflowforge/**']
  pull_request:
    paths: ['workflowforge/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workflowforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: workflowforge/package.json
      - run: npm install
      - run: npm run build
