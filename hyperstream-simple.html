<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{height:100%;overflow:hidden;background:#01040f;color:#e2e8f0;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif}body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}#viewer{flex:1;position:relative;background:radial-gradient(ellipse at center,#0f172a 0%,#01040f 80%);min-height:0}canvas{display:block;width:100%;height:100%}.stats{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}.stats span{background:rgba(2,6,18,.75);backdrop-filter:blur(8px);padding:6px 10px;border-radius:8px;font-size:11px;color:#94a3b8;border:1px solid rgba(255,255,255,.06)}.stats b{color:#ec4899}#controls{background:rgba(2,6,18,.97);border-top:1px solid #1e293b;padding:12px 14px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;z-index:20}.row{display:flex;gap:8px;align-items:center}.btn{flex:1;border:none;border-radius:12px;padding:14px 10px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .1s,filter .15s}.btn:active{transform:scale(.97)}.btn-main{background:linear-gradient(135deg,#7c3aed,#db2777);font-size:14px;padding:16px}.btn-main.on{background:linear-gradient(135deg,#ea580c,#be185d)}.btn-sec{background:#1e293b;border:1px solid #334155;font-size:12px;padding:12px}.btn-green{background:#059669}.btn-blue{background:#0284c7}.slider-row{display:flex;align-items:center;gap:10px;font-size:12px;color:#94a3b8}.slider-row label{min-width:70px}.slider-row input[type=range]{flex:1;accent-color:#ec4899;height:28px}.slider-row span{min-width:28px;text-align:right;font-variant-numeric:tabular-nums}.tiny{font-size:11px;color:#64748b;text-align:center;margin-top:2px}#vid{display:none}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
</head><body><div id="viewer"><div class="stats"><span id="status">Ready</span><span>FPS <b id="fpsD">—</b> · <b id="nodesD">0</b> pts</span></div><video id="vid" autoplay playsinline muted></video><canvas id="c3"></canvas></div><div id="controls"><button class="btn btn-main" id="scanBtn" onclick="toggleScan()">▶ Start 4D Scan</button><div class="row"><button class="btn btn-sec" id="camBtn" onclick="switchCam()">📷 Flip</button><button class="btn btn-sec" id="playBtn" onclick="togglePlay()">⏯ Play</button><button class="btn btn-sec" onclick="resetCam()">↺ Center</button></div><div class="slider-row"><label>Depth</label><input type="range" id="depth" min="30" max="130" value="90" oninput="depthMul=+this.value;$('depthV').textContent=this.value"><span id="depthV">90</span></div><div class="slider-row"><label>Layers</label><input type="range" id="layers" min="6" max="20" value="14" oninput="layerN=+this.value;$('layV').textContent=this.value"><span id="layV">14</span></div><div class="slider-row"><label>Size</label><input type="range" id="psize" min="0.008" max="0.04" value="0.014" step="0.001" oninput="ptSize=+this.value;updSize();$('sizeV').textContent=this.value"><span id="sizeV">0.014</span></div><div class="row"><button class="btn btn-green" onclick="expPNG()">📸 Photo</button><button class="btn btn-blue" onclick="shareNative()">📤 Share</button></div><div class="tiny">Pinch / drag to look around · Best in landscape or upright</div></div>
<script>
const $=id=>document.getElementById(id);let scene,cam,ren,ctrl,composer,bloomPass,glitchPass,glitchUniforms,stars,grid,layers=[],prevPos=[],video,c2d,ctx,scanning=false,rec=[],fIdx=0,stepSize=2,depthMul=90,ptSize=.014,layerN=14,layerSp=2.05,smooth=.48,rMode='points',metaV=.30,playFPS=22,isPlay=false,frames=[],playIdx=0,lastT=0,autoOrbit=true,doPulse=true,facing='user',stream=null,ready=false,lastVol=0,fc=0,ft=0,phase=0,exporting=false;
const VOL_MS=34;const ChromaticGlitchShader={uniforms:{tDiffuse:{value:null},amount:{value:.08},time:{value:0}},vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,fragmentShader:`uniform sampler2D tDiffuse;uniform float amount;uniform float time;varying vec2 vUv;void main(){vec2 uv=vUv;float g=sin(time*6.5)*.0012*amount;vec4 cr=texture2D(tDiffuse,uv+vec2(g+amount*.003,0.));vec4 cg=texture2D(tDiffuse,uv);vec4 cb=texture2D(tDiffuse,uv-vec2(g+amount*.003,0.));gl_FragColor=vec4(cr.r,cg.g,cb.b,cg.a);}`};
window.addEventListener('DOMContentLoaded',()=>{init3();initCam('user')});function init3(){const box=$('viewer');scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x01040f,.0155);cam=new THREE.PerspectiveCamera(36,box.clientWidth/box.clientHeight,.12,800);cam.position.set(0,1.4,6);ren=new THREE.WebGLRenderer({canvas:$('c3'),antialias:true,powerPreference:'high-performance',preserveDrawingBuffer:true,alpha:false});ren.setSize(box.clientWidth,box.clientHeight);ren.setPixelRatio(Math.min(devicePixelRatio||1,1.6));ren.setClearColor(0x01040f);composer=new THREE.EffectComposer(ren);composer.addPass(new THREE.RenderPass(scene,cam));bloomPass=new THREE.UnrealBloomPass(new THREE.Vector2(box.clientWidth,box.clientHeight),.65,.45,.88);composer.addPass(bloomPass);glitchPass=new THREE.ShaderPass(ChromaticGlitchShader);glitchUniforms=glitchPass.uniforms;composer.addPass(glitchPass);ctrl=new THREE.OrbitControls(cam,ren.domElement);ctrl.enableDamping=true;ctrl.dampingFactor=.1;ctrl.rotateSpeed=.55;ctrl.autoRotate=true;ctrl.autoRotateSpeed=.25;ctrl.target.set(0,.25,0);ctrl.minDistance=2.2;ctrl.maxDistance=18;ctrl.enablePan=false;ctrl.update();const starGeo=new THREE.BufferGeometry(),starCount=550,starPos=new Float32Array(starCount*3);for(let i=0;i<starCount;i++){const r=22+Math.random()*40,t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1);starPos[i*3]=r*Math.sin(p)*Math.cos(t);starPos[i*3+1]=r*Math.sin(p)*Math.sin(t)*.5;starPos[i*3+2]=r*Math.cos(p)}starGeo.setAttribute('position',new THREE.BufferAttribute(starPos,3));stars=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0x334155,size:.025,transparent:true,opacity:.35,depthWrite:false}));scene.add(stars);grid=new THREE.GridHelper(55,40,0x4c1d95,0x0c1222);grid.position.y=-2.3;scene.add(grid);scene.add(new THREE.AmbientLight(0x64748b,.48));let l1=new THREE.DirectionalLight(0x38bdf8,1.05);l1.position.set(3.5,7,5);scene.add(l1);let l2=new THREE.DirectionalLight(0xdb2777,.75);l2.position.set(-4,-2,-4);scene.add(l2);addEventListener('resize',onResize);addEventListener('orientationchange',()=>setTimeout(onResize,200));loop()}
function onResize(){const box=$('viewer');cam.aspect=box.clientWidth/box.clientHeight;cam.updateProjectionMatrix();ren.setSize(box.clientWidth,box.clientHeight);composer.setSize(box.clientWidth,box.clientHeight)}function initCam(face){video=$('vid');c2d=document.createElement('canvas');ctx=c2d.getContext('2d',{willReadFrequently:true});if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}ready=false;if(!navigator.mediaDevices?.getUserMedia){$('status').textContent='Camera unavailable';return}navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:face},width:{ideal:640},height:{ideal:480},frameRate:{ideal:24}},audio:false}).then(s=>{stream=s;facing=face;video.srcObject=s;return video.play()}).then(()=>{ready=true;$('camBtn').textContent=face==='environment'?'📷 Back':'📷 Front';$('status').textContent='Camera live'}).catch(()=>{if(face!=='user')initCam('user');else $('status').textContent='Camera error'})}function switchCam(){initCam(facing==='user'?'environment':'user')}function resetCam(){cam.position.set(0,1.4,6);ctrl.target.set(0,.25,0);ctrl.update()}
function loop(now=performance.now()){requestAnimationFrame(loop);ctrl.autoRotate=autoOrbit&&!exporting;ctrl.update();phase=now*.001;glitchUniforms.time.value=phase;stars.rotation.y=phase*.012;fc++;if(now-ft>1000){$('fpsD').textContent=Math.round(fc*1000/(now-ft));fc=0;ft=now}if(ready&&video.readyState>=2&&!exporting&&!isPlay&&now-lastVol>VOL_MS){lastVol=now;sample()}if(doPulse&&layers.length&&!exporting)layers.forEach((o,i)=>{if(o&&o.visible){const s=1+Math.sin(phase*2.1+i*.15)*.009;o.scale.setScalar(s)}});if(isPlay&&frames.length&&!exporting&&now-lastT>1000/playFPS){drawFrame(playIdx);playIdx=(playIdx+1)%frames.length;lastT=now}if(composer&&!exporting)composer.render();else ren.render(scene,cam)}
function sample(){const w=video.videoWidth||640,h=video.videoHeight||480;if(c2d.width!==w||c2d.height!==h){c2d.width=w;c2d.height=h}try{ctx.drawImage(video,0,0,w,h)}catch{return}let pix;try{pix=ctx.getImageData(0,0,w,h).data}catch{return}const pos=[],col=[],cx=w*.5,cy=h*.5,maxR=Math.hypot(cx,cy)||1,sx=1.5*Math.min(w/Math.max(h,1),1.5),sy=1.5,maxP=42000,step=Math.max(1,stepSize|0),thr=.0085;for(let y=0;y<h&&pos.length/3<maxP;y+=step)for(let x=0;x<w&&pos.length/3<maxP;x+=step){let i=(y*w+x)*4,r=pix[i]/255,g=pix[i+1]/255,b=pix[i+2]/255,lum=.299*r+.587*g+.114*b;if(lum<thr)continue;let nx=((w-x)/w)*2-1,ny=-((y/h)*2-1),dx=(x-cx)/maxR,dy=(y-cy)/maxR,rad=dx*dx+dy*dy,nz=(lum-.155)*(depthMul*.044)-rad*.52;pos.push(nx*sx,ny*sy,nz);let avg=(r+g+b)/3;col.push(Math.min(1,avg+(r-avg)*1.3+.1),Math.min(1,avg+(g-avg)*1.2+.06),Math.min(1,avg+(b-avg)*1.4+.18))}const n=pos.length/3;$('nodesD').textContent=(n*layerN).toLocaleString();buildLayers(pos,col);if(scanning){let v=[];for(let i=0;i<pos.length;i+=3)v.push(+pos[i].toFixed(3),+pos[i+1].toFixed(3),+pos[i+2].toFixed(3));rec.push({v,c:col.map(x=>+x.toFixed(2)),meta:.25+Math.random()*.15,layers:layerN,spread:layerSp});fIdx++;if(fIdx%6===0&&rec.length>90)rec.shift()}}
function buildLayers(basePos,baseCol){while(layers.length>layerN){let o=layers.pop();scene.remove(o);o.geometry.dispose();o.material.dispose();prevPos.pop()}const n=basePos.length/3;if(n<4)return;const maxL=Math.max(1,layerN-1),mOff=metaV*.34;for(let L=0;L<layerN;L++){let t=L/maxL,zOff=(t-.5)*layerSp*2.15,front=1-t,pos=new Float32Array(n*3),col=new Float32Array(n*3);for(let i=0,j=0;i<n;i++,j+=3){let px=basePos[j],py=basePos[j+1]+mOff*(.45+L*.022),pz=basePos[j+2]+zOff;if(prevPos[L]&&prevPos[L].length===pos.length&&smooth>.05){let p=prevPos[L],k=smooth;px=px*(1-k)+p[j]*k;py=py*(1-k)+p[j+1]*k;pz=pz*(1-k)+p[j+2]*k}pos[j]=px;pos[j+1]=py;pos[j+2]=pz;let bcR=baseCol[j]??.4,bcG=baseCol[j+1]??.32,bcB=baseCol[j+2]??.7,df=.48+front*.52;col[j]=Math.min(1,bcR*df);col[j+1]=Math.min(1,bcG*(.65+front*.35));col[j+2]=Math.min(1,bcB*(.6+front*.4))}prevPos[L]=pos;let size=ptSize*(1.1-L*.02),op=Math.max(.18,.78-L*.05),o=layers[L];if(!o){let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));o=new THREE.Points(g,new THREE.PointsMaterial({size,sizeAttenuation:true,vertexColors:true,transparent:true,opacity:op,depthWrite:false,blending:THREE.NormalBlending}));scene.add(o);layers[L]=o}else{let oldN=o.geometry.attributes.position?.count||0;if(oldN!==n){o.geometry.setAttribute('position',new THREE.BufferAttribute(pos,3));o.geometry.setAttribute('color',new THREE.BufferAttribute(col,3))}else{o.geometry.attributes.position.array.set(pos);o.geometry.attributes.color.array.set(col);o.geometry.attributes.position.needsUpdate=true;o.geometry.attributes.color.needsUpdate=true}o.material.size=size;o.material.opacity=op}}}
function updSize(){layers.forEach((o,L)=>{if(o?.material)o.material.size=ptSize*(1.1-L*.02)})}function toggleScan(){scanning=!scanning;let b=$('scanBtn');if(scanning){rec=[];fIdx=0;frames=[];isPlay=false;$('playBtn').textContent='⏯ Play';b.textContent='⏹ Stop Scan';b.classList.add('on');$('status').textContent='Scanning…'}else{b.textContent='▶ Start 4D Scan';b.classList.remove('on');$('status').textContent='Scan done';if(rec.length){frames=rec.map(f=>({vertices:f.v,colors:f.c,meta:f.meta||.3,layers:f.layers||layerN,spread:f.spread||layerSp}));playIdx=0;isPlay=true;$('playBtn').textContent='⏸ Pause';drawFrame(0);$('status').textContent=frames.length+' frames ready'}}}function togglePlay(){if(!frames.length)return;isPlay=!isPlay;$('playBtn').textContent=isPlay?'⏸ Pause':'⏯ Play'}function drawFrame(idx){if(!frames.length)return;let f=frames[idx%frames.length],src=f.vertices,cols=f.colors||[],pos=[],col=[];for(let i=0;i<src.length;i+=3){pos.push(src[i],src[i+1]+(f.meta||.3)*metaV*.34,src[i+2]);let ci=i;cols.length>=ci+3?col.push(cols[ci],cols[ci+1],cols[ci+2]):col.push(.4,.32,.7)}let prevN=layerN,prevS=layerSp;layerN=f.layers||layerN;layerSp=f.spread||layerSp;buildLayers(pos,col);layerN=prevN;layerSp=prevS;$('nodesD').textContent=((pos.length/3)*(f.layers||layerN)).toLocaleString()}function expPNG(){if(!layers.length)return;composer.render();let a=document.createElement('a');a.href=$('c3').toDataURL('image/png');a.download='hologram_'+Date.now()+'.png';a.click()}function shareNative(){if(!navigator.share){alert('Share works best on iPhone Safari');return}let payload=rec.length?{HyperStreamXD:rec,layers:layerN,spread:layerSp}:(frames.length?{HyperStreamXD:frames,layers:layerN,spread:layerSp}:null);if(!payload){alert('Scan something first');return}let file=new File([JSON.stringify(payload)],'hologram.json',{type:'application/json'});if(navigator.canShare?.({files:[file]}))navigator.share({title:'My 4D Hologram',files:[file]}).catch(()=>{});else navigator.share({title:'My 4D Hologram',text:'Check out this hologram!',url:location.href}).catch(()=>{})}
</script></body></html>
