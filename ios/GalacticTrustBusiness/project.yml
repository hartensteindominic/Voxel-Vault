name: GalacticTrustBusiness
options:
  bundleIdPrefix: com.hartensteindominic
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  GalacticTrustBusiness:
    type: application
    platform: iOS
    sources:
      - path: GalacticTrustBusiness
        excludes:
          - Assets.xcassets
          - PrivacyInfo.xcprivacy
    resources:
      - path: GalacticTrustBusiness/Assets.xcassets
      - path: GalacticTrustBusiness/PrivacyInfo.xcprivacy
    preBuildScripts:
      - name: Generate Galactic App Icon
        script: |
          python3 "$SRCROOT/scripts/generate_app_icon.py"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hartensteindominic.galactictrustbusiness
        PRODUCT_NAME: GalacticTrustBusiness
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Galactic Trust Business
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - GalacticTrustBusinessTests
  GalacticTrustBusinessTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GalacticTrustBusinessTests
    dependencies:
      - target: GalacticTrustBusiness
